{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card card shadow-lg p-4">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3">
        <i class="bi bi-kanban-fill"></i>
      </div>
      <h2 class="fw-bold">Welcome Back</h2>
      <p class="text-muted">Sign in to your TaskFlow account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required/>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </form>

    <hr class="my-4"/>
    <p class="text-center text-muted mb-0">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
