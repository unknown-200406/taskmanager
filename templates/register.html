{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card card shadow-lg p-4">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3">
        <i class="bi bi-kanban-fill"></i>
      </div>
      <h2 class="fw-bold">Create Account</h2>
      <p class="text-muted">Join TaskFlow and manage your work</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Your name" required/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Create a password" required/>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 btn-lg fw-semibold">
        <i class="bi bi-person-plus me-2"></i>Create Account
      </button>
    </form>

    <hr class="my-4"/>
    <p class="text-center text-muted mb-0">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
